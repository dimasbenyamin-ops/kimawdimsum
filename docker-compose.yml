# ============================================================
# Kumaw Dimsum — Docker Compose
# Services: app (PHP-FPM), nginx, redis, reverb (WebSocket)
# Database: shared 'mariadb' container on external optima network
# Network: external 'optima' shared network
# ============================================================

networks:
  optima:
    external: true

volumes:
  redis_data:
    driver: local

services:

  # ----------------------------------------------------------
  # PHP-FPM Application Server
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kumaw_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - optima
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ----------------------------------------------------------
  # Nginx Web Server (proxies PHP & Reverb WebSocket)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: kumaw_nginx
    restart: unless-stopped
    ports:
      - "80:80"   # Laravel HTTP
      - "443:443"  # HTTPS (optional)
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - optima
    depends_on:
      - app

  # ----------------------------------------------------------
  # Redis 7 — Cache, Session & Queue backend
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kumaw_redis
    restart: unless-stopped
    ports:
      - "6380:6379" # Remapped: host Redis is on 6379
    volumes:
      - redis_data:/data
    networks:
      - optima
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # Laravel Reverb — WebSocket Server
  # Connects to shared mariadb via optima network
  # ----------------------------------------------------------
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kumaw_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    ports:
      - "8080:8080" # WebSocket port
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - optima
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
